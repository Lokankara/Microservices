name: CI Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  checks: write

jobs:
  run-test:
    name: 'Run tests'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres

        env:
          POSTGRES_PASSWORD: root
          POSTGRES_USER: admin
          POSTGRES_DB: test

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - run: |
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client
        env:
          PGPASSWORD: root

      - name: Git clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Gradle test
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :qa-service:test --no-daemon

      - name: Attach screenshots and reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-and-report
          path: '**/build/reports/tests/test/'

      - name: Test Reporter
        uses: dorny/test-reporter@v1.9.1
        if: success() || failure()
        continue-on-error: true
        with:
          name: All Tests Report
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Allure
        if: always()
        run: |
          curl -o allure-2.25.0.tgz -Ls https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz
          sudo tar -zxvf allure-2.25.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.25.0/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        if: always()
        run: allure generate qa-service/allure-results -o allure-report --clean || true

      - name: Deploy report to Github Pages
        if: always()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
