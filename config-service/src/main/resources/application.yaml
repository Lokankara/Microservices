server:
  port: 8888

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        prefix: /config
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/PashaPoliak/config-repo.git}
          default-label: master
          clone-on-start: true
          force-pull: true
        bootstrap: true
        native:
          searchLocations: file:./config-repo

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
