eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8080

song:
  service:
    url: http://localhost:8081

spring:
  application:
    name: resource-service
  datasource:
    url: ${RESOURCE_DB_URL:jdbc:postgresql://${RESOURCE_DB_HOST:resource-db}:${RESOURCE_DB_PORT:5432}/${RESOURCE_DB_NAME:postgres}
    username: ${RESOURCE_DB_USER:postgres}
    password: ${RESOURCE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    stream:
      function:
        definition: processedResource
      bindings:
        resourceUpload-out-0:
          destination: resource-processing
        processedResource-in-0:
          destination: resource-processed
          group: resource-service-group
      rabbit:
        bindings:
          resourceUpload-out-0:
            producer:
              autoBindDlq: true
          processedResource-in-0:
            consumer:
              autoBindDlq: true
              requeueRejected: false
    aws:
      s3:
        endpoint: ${S3_ENDPOINT:http://localstack:4566}
        bucket-name: mp3-bucket
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
        secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
      region:
        static: us-east-1
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

resilience4j:
  circuitbreaker:
    instances:
      songService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
