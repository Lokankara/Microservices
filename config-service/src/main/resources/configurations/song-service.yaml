eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8081

spring:
  datasource:
    url: ${SONG_DB_URL:jdbc:postgresql://${SONG_DB_HOST:song-db}:${SONG_DB_PORT:5432}/${SONG_DB_NAME:postgres}
    username: ${SONG_DB_USER:postgres}
    password: ${SONG_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
