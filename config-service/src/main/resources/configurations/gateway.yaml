eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: song-service
          uri: lb://song-service
          predicates:
            - Path=/songs/**

        - id: resource-service
          uri: lb://resource-service
          predicates:
            - Path=/resources/**

management:
  tracing:
    sampling:
      probability: 1.0