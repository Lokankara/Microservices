plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.audio'
version = '0.0.1-SNAPSHOT'
description = 'test'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

	testImplementation 'io.rest-assured:rest-assured:5.4.0'
	testImplementation 'org.jbehave:jbehave-core:5.0'
	testImplementation 'org.jbehave:jbehave-spring:5.0'
  testImplementation 'io.qameta.allure:allure-junit5:2.24.0'
  testImplementation 'io.qameta.allure:allure-rest-assured:2.24.0'
  testImplementation 'io.qameta.allure:allure-jbehave:2.24.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
