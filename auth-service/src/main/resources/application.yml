server:
  port: 9000
  servlet:
    context-path: /auth

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: WARN
