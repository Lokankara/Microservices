input {
  tcp {
    port => 5000
    codec => json
    type => "docker"
  }
  udp {
    port => 5000
    codec => json
    type => "docker"
  }
}

filter {
  if [type] == "docker" {
    if [message] =~ /^\{/ {
      json {
        source => "message"
      }
    }
  }

  if [traceId] {
    mutate {
      rename => { "traceId" => "trace_id" }
    }
  }
  
  if [spanId] {
    mutate {
      rename => { "spanId" => "span_id" }
    }
  }

  if ![@timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST}:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    data_stream => false
  }
  stdout {
    codec => json
  }
}
